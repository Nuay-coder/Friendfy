<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Dashboard</title>
    <link rel="stylesheet" href="style-admin.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
    <script src="script.js"></script>

<body>
    <div class="header">
        <div class="logo-section">
            <div class="logo">
                <img src="image/icon-back.png" alt="Back Icon" class="back-icon">
            </div>
            <h3>Management</h3>
        </div>

        <div class="user-section">
            <img src="image\icon-dashboard.png">
            Dashboard

        </div>
    </div>

    <div class="sidebar">
        <a href="dashboard-admin.html" class="menu-item active" style="text-decoration: none; color: black;">
            <img src="image/icon-dashboard.png" class="menu-icon">
            <span>Dashboard</span>
        </a>

        <div class="menu-item">
            <a href="user-admin.html" style="text-decoration: none; color: black;">
                <img src="image/icon-user.png" class="menu-icon">
                <span>User</span>
            </a>
        </div>


        <div class="menu-item">
            <a href="event-admin.html" style="text-decoration: none; color: black;">
                <img src="image/icon-event.png" class="menu-icon">
                <span>Event</span>
            </a>
        </div>

        <div class="menu-item">
            <a href="reservation-admin.html" style="text-decoration: none; color: black;">
                <img src="image/icon-reservation.png" class="menu-icon">
                <span>Reservation</span>
            </a>
        </div>

        <div class="button-container">
            <button class="test-button" id="openImageUploadBtn">
                <img src="image\icon-test.png" class="menu-icon">
                <span>TEST</span>
            </button>


            <button class="logout-button">
                <img src="image/icon-logout(white).png" class="logout-icon">
                <span>Log Out</span>
            </button>
        </div>
    </div>

    <div class="main-content">
        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-title">Total Users</div>
                <div class="stat-value">999,999</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Events</div>
                <div class="stat-value">12,467</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total Reservation</div>
                <div class="stat-value">230,090</div>
            </div>
        </div>

        <div class="chart-container">
            <div class="chart-card">
                <div class="chart-title">Gender of users</div>
                <!-- Chart content would go here -->
            </div>

            <div class="chart-card">
                <div class="chart-title">Top Reservation</div>

                <div class="subtitle dropdown">
                    <span id="selected-period" onclick="toggleDropdown()">This week <img src="image\icon-more.png">
                    </span>
                    <ul class="dropdown-menu" id="dropdownMenu">
                        <li onclick="changePeriod('Today')">Today</li>
                        <li onclick="changePeriod('This week')">This week</li>
                        <li onclick="changePeriod('This month')">This month</li>
                    </ul>
                </div>
                <!-- Reservation details would go here -->
            </div>



            </div>
        </div>
</body>

</html>

</html>
