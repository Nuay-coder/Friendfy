
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Friendly Admin</title>
  <link rel="stylesheet" href="Frontend/css/login-admin.css">
</head>
<body>
  <div class="container">
    <div class="left">
      <img src="Frontend/image/logo.png" alt="Logo" class="logo">
      <p class="subtitle">for administrators</p>
    </div>
    <div class="right">
      <div class="login-box">
        <h2>Log in</h2>
        <form>
          <label>Username</label>
          <input type="text" name="username" placeholder="Username" required>
          <label>Password</label>
          <div class="password-field">
            <input type="password" name="password" placeholder="Enter your password" required>
          </div>
          <button type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>
  <script src="Frontend/js/loginadmin.js"></script>
</body>
</html>
