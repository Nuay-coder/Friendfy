<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Management</title>
  <link rel="stylesheet" href="/Frontend/css/style-admin.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>

</head>

<body>
  <div class="header">
    <div class="logo-section">
      <div class="logo">
        <img src="image/icon-back.png" alt="Back Icon" class="back-icon" />
      </div>
      <h3>Management</h3>
    </div>

    <div class="user-section">
      <img src="image\icon-event.png" />
      Event
    </div>
  </div>

  <div class="sidebar">
    <div class="menu-item">
      <a href="dashboard" style="text-decoration: none; color: black;">
        <img src="image/icon-dashboard.png" class="menu-icon" />
        <span>Dashboard</span>
      </a>
    </div>

    <div class="menu-item">
      <a href="user-admin" style="text-decoration: none; color: black;">
        <img src="image/icon-user.png" class="menu-icon">
        <span>User</span>
      </a>
    </div>

    <div class="menu-item active">
      <a href="event-admin" style="text-decoration: none; color: black;">
        <img src="image/icon-event.png" class="menu-icon" />
        <span>Event</span>
      </a>
    </div>

    <div class="menu-item">
      <a href="reservation-admin" style="text-decoration: none; color: black;">
        <img src="image/icon-reservation.png" class="menu-icon" />
        <span>Reservation</span>
      </a>
    </div>

    <div class="button-container">
      <button class="test-button" id="openImageUploadBtn">
        <img src="image/icon-test.png" class="menu-icon" />
        <span>TEST</span>
      </button>

      <button class="logout-button">
        <img src="image/icon-logout(white).png" class="logout-icon" />
        <span>Log Out</span>
      </button>
    </div>
  </div>

  <div class="event-header">
    <button class="add-event-btn" id="openAddEventModal">+ Add Event</button>
    <div class="search-input-wrapper">
      <div class="search-icon">
        <img src="image\icon-search.png" width="20px" height="20px" />
        <input type="text" class="search-input" placeholder="Search">
      </div>
    </div>
  </div>

  <div class="main-content">
    <table>
      <thead>
        <tr>
          <th>User ID</th>
          <th>Name</th>
          <th>Gender</th>
          <th>Join Date</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>U001</td>
          <td>John Doe</td>
          <td>Male</td>
          <td>2023-05-01</td>
          <td>john@example.com</td>
          <td>081-234-5678</td>
          <td>Active</td>
          <td>Edit | Delete</td>
        </tr>
        <tr>
          <td>U002</td>
          <td>Harry</td>
          <td>Male</td>
          <td>2023-05-01</td>
          <td>Harry@example.com</td>
          <td>081-234-5678</td>
          <td>Active</td>
          <td>Edit | Delete</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Event Modal -->
  <div class="modal-overlay" id="addEventModal">
    <div class="modal-container">
      <div class="modal-header">
        <h4>Add Event</h4>
        <button class="close-btn" id="closeAddEventModal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="image-upload" id="eventImageUpload">
          <div class="upload-icon">&#43;</div>
        </div>

        <div class="form-group">
          <label for="eventName">Event name</label>
          <input type="text" class="form-control yellow-bg" id="eventName" placeholder="Enter event name">
        </div>

        <div class="form-group">
          <label for="eventLocation">Location</label>
          <select class="form-control yellow-bg" id="eventLocation">
            <option value="" disabled selected>Select location</option>
            <option value="location1">Skibidi Football Field</option>
            <option value="location2">Skibidi Basketball courts</option>
            <option value="location3">Skibidi Badminton courts</option>
            <option value="location4">Skibidi Center</option>
          </select>
        </div>

        <div class="form-group">
          <label for="startDate">Start Date</label>
          <div class="date-time-container">
            <input type="date" class="form-control yellow-bg date-input" id="startDate">
            <input type="time" class="form-control yellow-bg time-input" id="startTime">
          </div>
        </div>

        <div class="form-group">
          <label for="endDate">End Date</label>
          <div class="date-time-container">
            <input type="date" class="form-control yellow-bg date-input" id="endDate">
            <input type="time" class="form-control yellow-bg time-input" id="endTime">
          </div>
        </div>

        <div class="form-group">
          <label for="eventDetails">Detail</label>
          <textarea class="form-control yellow-bg" id="eventDetails" placeholder="Write more details..."></textarea>
        </div>

        <button class="button-add" id="addEventBtn">ADD</button>
      </div>
    </div>
  </div>

  <script src="/js/script.js"></script>
</body>

</html>
