<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation Management</title>
  <link rel="stylesheet" href="style-admin.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.1/chart.min.js"></script>
  <script src="script.js"></script>
</head>

<body>
  <div class="header">
    <div class="logo-section">
      <div class="logo">
        <img src="image/icon-back.png" alt="Back Icon" class="back-icon" />
      </div>
      <h3>Management</h3>
    </div>

    <div class="user-section">
      <img src="image\icon-reservation.png" />
      Reservation
    </div>
  </div>

  <div class="sidebar">
    <div class="menu-item">
      <a href="dashboard" style="text-decoration: none; color: black;">
        <img src="image/icon-dashboard.png" class="menu-icon" />
        <span>Dashboard</span>
      </a>
    </div>

    <div class="menu-item">
      <a href="user-admin" style="text-decoration: none; color: black;">
        <img src="image/icon-user.png" class="menu-icon">
        <span>User</span>
      </a>
    </div>

    <div class="menu-item">
      <a href="event-admin" style="text-decoration: none; color: black;">
        <img src="image/icon-event.png" class="menu-icon" />
        <span>Event</span>
      </a>
    </div>

    <div class="menu-item active">
      <a href="reservation-admin" style="text-decoration: none; color: black;">
        <img src="image/icon-reservation.png" class="menu-icon" />
        <span>Reservation</span>
      </a>
    </div>

    <div class="button-container">
      <button class="test-button" id="openImageUploadBtn">
        <img src="image/icon-test.png" class="menu-icon" />
        <span>TEST</span>
      </button>

      <button class="logout-button">
        <img src="image/icon-logout(white).png" class="logout-icon" />
        <span>Log Out</span>
      </button>
    </div>
  </div>


  <div class="main-content">
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Name</th>
          <th>Participants</th>
          <th>Start Date</th>
          <th>Start Time</th>
          <th>End Date</th>
          <th>End Time</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <!-- Table body will be populated with data -->
    </table>
  </div>




</body>

</html>
